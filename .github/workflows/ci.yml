name: CI

on:
  pull_request:
    branches: [main]
  push:
    # m1/** so every story branch is tested on macOS before it can merge (M1 routine).
    branches: [main, 'm1/**']

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: No direct Date() calls outside ClockProviding
        run: ./scripts/check-no-date.sh

      # The runner's default is Xcode 16.4 (Swift 6.1); development happens on Xcode 26.3
      # (Swift 6.2). The two disagree about actor isolation, so code that built locally
      # was rejected here and every M1 "fix" chased the wrong compiler. Pin CI to the
      # toolchain the code is actually written and run against.
      - name: Select Xcode 26.3 (matches local development)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Resolve a Simulator destination
        id: destination
        run: |
          DEVICE=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][-1].name')
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build and test
        # Scoped to RukiTests (unit tests) only. RukiUITests is still Xcode's
        # empty boilerplate — no M0/M1 story has written UI test content yet —
        # and XCUITest needs a real accessibility session to launch, which
        # this scoping sidesteps until there's something in it worth running.
        run: |
          set -o pipefail
          xcodebuild test \
            -project Ruki.xcodeproj \
            -scheme Ruki \
            -destination "platform=iOS Simulator,name=${{ steps.destination.outputs.device }}" \
            -only-testing:RukiTests 2>&1 | tee test.log

      - name: No compiler warnings (Debug)
        run: ./scripts/check-no-warnings.sh test.log

      # The Simulator build compiles a placeholder camera, so the real AVFoundation
      # code (AVCameraProvider) is only compiled against the device SDK. No signing
      # needed just to type-check it.
      - name: Device SDK build (compiles the real camera code)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Ruki.xcodeproj \
            -scheme Ruki \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee device.log
          ./scripts/check-no-warnings.sh device.log

      # L6 (docs/M1-PLAYBOOK.md SS5): a first attempt at wiring RukiUITests
      # into CI, now that it has real content (onboarding -> Today ->
      # check-in -> history, plus an accessibility audit). Separate step
      # from the unit-test build above so a UI-test-specific failure is
      # easy to attribute; if this turns out unreliable on CI it comes back
      # out per D29 rather than staying as permanent noise.
      - name: UI smoke tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Ruki.xcodeproj \
            -scheme Ruki \
            -destination "platform=iOS Simulator,name=${{ steps.destination.outputs.device }}" \
            -only-testing:RukiUITests 2>&1 | tee ui-test.log

      - name: Release build, no warnings
        run: |
          set -o pipefail
          xcodebuild build \
            -project Ruki.xcodeproj \
            -scheme Ruki \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' 2>&1 | tee release.log
          ./scripts/check-no-warnings.sh release.log
